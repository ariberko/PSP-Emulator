[workspace]
resolver = "2"
members = ["crates/psp-metadata", "crates/psp-host", "apps/desktop/src-tauri"]
# The Tauri crate needs system webkit2gtk to build, so it is excluded from the
# default set. `cargo test` therefore exercises all the logic that matters on any
# machine, and only bundling the desktop app requires the system libraries.
default-members = ["crates/psp-metadata", "crates/psp-host"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/ariberko/PSP-Emulator"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
