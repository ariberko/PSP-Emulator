[workspace]
resolver = "2"
members = ["crates/psp-metadata"]
# The Tauri app needs system webkit2gtk to build. `cargo test -p psp-metadata`
# works without it, so CI tests the core crate separately from the desktop bundle.
default-members = ["crates/psp-metadata"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/ariberko/PSP-Emulator"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
