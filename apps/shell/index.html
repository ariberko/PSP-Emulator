<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>PSP-Emulator</title>
    <meta
      name="description"
      content="A PSP XMB shell for PPSSPP — the console's CrossMediaBar on your desktop."
    />
  </head>
  <body>
    <!--
      The stage is a fixed 480x272 — the PSP's real panel resolution — and is
      scaled to the window by main.ts. Everything inside it is generated by
      XmbView, so the boot overlay lives outside it as a sibling; otherwise the
      first render would wipe it out.
    -->
    <div class="stage-frame">
      <div class="stage"></div>
      <div class="boot"><div class="boot-sweep"></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
