[package]
name = "psp-emulator-desktop"
description = "PSP XMB shell for PPSSPP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# Tauri v2 puts the app in a library so mobile targets can link it; main.rs is a
# one-line wrapper around run().
name = "psp_emulator_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
psp-host = { path = "../../../crates/psp-host" }
psp-metadata = { path = "../../../crates/psp-metadata" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
