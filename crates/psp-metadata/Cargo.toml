[package]
name = "psp-metadata"
description = "Reads PSP game metadata out of ISO, CSO, PBP and EBOOT files"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Pure-Rust inflate. CSO blocks are raw deflate streams, and a pure-Rust
# decoder keeps cross-compiling the desktop app free of a zlib dependency.
miniz_oxide = "0.8"

[dev-dependencies]
tempfile = "3"

[features]
# Exposes the synthetic-fixture builders to downstream crates and integration tests.
testkit = []

[[example]]
name = "make-fixtures"
# The builders it uses only exist behind the feature, so declare the requirement
# rather than letting a plain `cargo build --all-targets` fail on it.
required-features = ["testkit"]
