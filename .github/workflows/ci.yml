name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The workspace's default members exclude the Tauri crate, so this needs no
      # system webview libraries. All the logic with real behaviour lives in
      # psp-metadata and psp-host, which build anywhere.
      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --features psp-metadata/testkit -- -D warnings

      - name: Test
        run: cargo test --all-features

  shell:
    name: Shell — typecheck, test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/shell
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/shell/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Build
        run: npx vite build

  desktop:
    name: Desktop — compile the Tauri app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Tauri links against the system webview; without these the crate cannot
      # even be typechecked.
      - name: Install webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev \
            librsvg2-dev patchelf

      - name: Build the shell bundle
        run: npm --prefix apps/shell ci && npm --prefix apps/shell run build

      - name: Check the desktop crate
        run: cargo check -p psp-emulator-desktop
